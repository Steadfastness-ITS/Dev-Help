<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#666666;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#888888;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main network structure -->
  <!-- Central nodes -->
  <circle cx="128" cy="100" r="8" fill="url(#nodeGradient)" />
  <circle cx="100" cy="120" r="6" fill="url(#nodeGradient)" />
  <circle cx="156" cy="120" r="6" fill="url(#nodeGradient)" />
  <circle cx="128" cy="140" r="7" fill="url(#nodeGradient)" />
  <circle cx="90" cy="140" r="5" fill="url(#nodeGradient)" />
  <circle cx="166" cy="140" r="5" fill="url(#nodeGradient)" />
  <circle cx="110" cy="160" r="6" fill="url(#nodeGradient)" />
  <circle cx="146" cy="160" r="6" fill="url(#nodeGradient)" />
  <circle cx="128" cy="180" r="7" fill="url(#nodeGradient)" />
  
  <!-- Floating nodes -->
  <circle cx="180" cy="80" r="4" fill="#d0d0d0" opacity="0.8" />
  <circle cx="200" cy="100" r="3" fill="#d0d0d0" opacity="0.6" />
  <circle cx="60" cy="200" r="4" fill="#888888" opacity="0.8" />
  <circle cx="40" cy="180" r="3" fill="#888888" opacity="0.6" />
  
  <!-- Connection lines -->
  <line x1="128" y1="100" x2="100" y2="120" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="128" y1="100" x2="156" y2="120" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="100" y1="120" x2="128" y2="140" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="156" y1="120" x2="128" y2="140" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="100" y1="120" x2="90" y2="140" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="156" y1="120" x2="166" y2="140" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="90" y1="140" x2="110" y2="160" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="128" y1="140" x2="110" y2="160" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="128" y1="140" x2="146" y2="160" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="166" y1="140" x2="146" y2="160" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="110" y1="160" x2="128" y2="180" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="146" y1="160" x2="128" y2="180" stroke="url(#lineGradient)" stroke-width="1.5" />
  
  <!-- Additional connections for complexity -->
  <line x1="128" y1="100" x2="128" y2="140" stroke="url(#lineGradient)" stroke-width="1" />
  <line x1="100" y1="120" x2="110" y2="160" stroke="url(#lineGradient)" stroke-width="1" />
  <line x1="156" y1="120" x2="146" y2="160" stroke="url(#lineGradient)" stroke-width="1" />
</svg>